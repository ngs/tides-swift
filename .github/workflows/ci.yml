name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - platform: iOS
            simulatorName: iPhone
            buildNumberSuffix: ".1"
          - platform: macOS
            simulatorName: ""
            buildNumberSuffix: ".2"
          - platform: visionOS
            simulatorName: Apple Vision Pro
            buildNumberSuffix: ".3"

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Available Xcode versions:"
            ls -la /Applications | grep Xcode
            echo "Error: Xcode 26.x not found"
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Install tuist (mise)
        uses: jdx/mise-action@v4.2.0

      - name: Generate Xcode project and workspace
        run: tuist generate --no-open
        env:
          TUIST_BUILD_NUMBER: ${{ github.run_id }}${{ matrix.buildNumberSuffix }}

      # Resolve the destination from the simulators the runner actually has,
      # so a runner image update to a new OS point release cannot break CI.
      - name: Resolve destination
        id: destination
        run: |
          if [ -z "${{ matrix.simulatorName }}" ]; then
            echo "destination=platform=macOS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "${{ matrix.simulatorName }}" \
            | grep -oE '[0-9A-F-]{36}' | head -1 || true)
          if [ -z "$DEVICE_ID" ]; then
            echo "No available simulator matching '${{ matrix.simulatorName }}'"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $DEVICE_ID"
          echo "destination=id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and Test (${{ matrix.platform }})
        run: |
          xcodebuild test \
            -scheme Tides \
            -destination '${{ steps.destination.outputs.destination }}' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean test

      - name: Archive snapshots (${{ matrix.platform }})
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ui-snapshots-${{ matrix.platform }}
          path: "**/__Snapshots__/**/*.latest.png"

  test-swift:
    name: Swift Tests
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Error: Xcode 26.x not found"; ls -la /Applications | grep Xcode; exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Run Swift Tests
        run: swift test

  lint:
    name: SwiftLint
    # The action-swiftlint image pins an old SwiftLint that cannot parse
    # modern Swift (it misreads `nonisolated(unsafe)`), so run the current
    # release from Homebrew instead - the same version developers have.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict

  periphery:
    name: Periphery Scan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Error: Xcode 26.x not found"; ls -la /Applications | grep Xcode; exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Install tuist (mise)
        uses: jdx/mise-action@v4.2.0
      - name: Install periphery
        run: brew install --formula periphery

      - name: Generate Xcode project and workspace
        run: tuist generate --no-open
        env:
          TUIST_BUILD_NUMBER: "${{ github.run_id }}.0"

      - name: periphery scan
        run: periphery scan --strict

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.317.0
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS Simulator"
            buildNumberSuffix: ".1"
            scheme: Tides
          - platform: macOS
            destination: "platform=macOS"
            buildNumberSuffix: ".2"
            scheme: Tides
          - platform: visionOS
            destination: "generic/platform=visionOS Simulator"
            buildNumberSuffix: ".3"
            scheme: Tides
          - platform: watchOS
            destination: "generic/platform=watchOS Simulator"
            buildNumberSuffix: ".4"
            scheme: TidesWatch

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Error: Xcode 26.x not found"; ls -la /Applications | grep Xcode; exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Install tuist (mise)
        uses: jdx/mise-action@v4.2.0

      - name: Generate Xcode project and workspace
        run: tuist generate --no-open
        env:
          TUIST_BUILD_NUMBER: "${{ github.run_id }}${{ matrix.buildNumberSuffix }}"

      - name: Build ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme '${{ matrix.scheme }}' \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build
